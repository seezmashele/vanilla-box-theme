<svg xmlns="http://www.w3.org/2000/svg" width="40" height="116">
<!-- Corner tiles are 8 wide so the top two corners carry an 8px radius. Each
     corner draws the border colour first and lays the background over it inset
     by 1px at radius 7, so the two antialiased edges stay concentric and no
     seam shows along the curve.

     The bottom corners are square, and deliberately so. Rounding them needs a
     bottom border to draw the curve in, and anything narrower than the radius
     lets the client window's square corner show through it. Breeze avoids that
     by calling KDecoration3::Decoration::setBorderRadius, which makes KWin clip
     the client itself — neither Aurorae plugin exposes that API, so an SVG
     theme cannot round the bottom without a visible bottom strip. -->
<g id="decoration-topleft"><path d="M0,31 L0,0 L8,0 L8,31 Z" fill="#363b42"/><path d="M1,31 L1,1 L8,1 L8,31 Z" class="ColorScheme-Background" fill="#272a2f"/></g>
<g id="decoration-top"><rect x="8" y="0" width="24" height="1" fill="#363b42"/><rect x="8" y="1" width="24" height="30" class="ColorScheme-Background" fill="#272a2f"/></g>
<g id="decoration-topright"><path d="M40,31 L40,0 L32,0 L32,31 Z" fill="#363b42"/><path d="M39,31 L39,1 L32,1 L32,31 Z" class="ColorScheme-Background" fill="#272a2f"/></g>
<g id="decoration-left"><rect x="0" y="31" width="1" height="24" fill="#363b42"/><rect x="1" y="31" width="7" height="24" class="ColorScheme-Background" fill="#272a2f"/></g>
<rect id="decoration-center" x="8" y="31" width="24" height="24" class="ColorScheme-Background" fill="#272a2f"/>
<g id="decoration-right"><rect x="32" y="31" width="7" height="24" class="ColorScheme-Background" fill="#272a2f"/><rect x="39" y="31" width="1" height="24" fill="#363b42"/></g>
<rect id="decoration-bottomleft" x="0" y="55" width="8" height="1" fill="#363b42"/>
<rect id="decoration-bottom" x="8" y="55" width="24" height="1" fill="#363b42"/>
<rect id="decoration-bottomright" x="32" y="55" width="8" height="1" fill="#363b42"/>
<g id="decoration-inactive-topleft"><path d="M0,91 L0,60 L8,60 L8,91 Z" fill="#363b42"/><path d="M1,91 L1,61 L8,61 L8,91 Z" class="ColorScheme-Background" fill="#272a2f"/></g>
<g id="decoration-inactive-top"><rect x="8" y="60" width="24" height="1" fill="#363b42"/><rect x="8" y="61" width="24" height="30" class="ColorScheme-Background" fill="#272a2f"/></g>
<g id="decoration-inactive-topright"><path d="M40,91 L40,60 L32,60 L32,91 Z" fill="#363b42"/><path d="M39,91 L39,61 L32,61 L32,91 Z" class="ColorScheme-Background" fill="#272a2f"/></g>
<g id="decoration-inactive-left"><rect x="0" y="91" width="1" height="24" fill="#363b42"/><rect x="1" y="91" width="7" height="24" class="ColorScheme-Background" fill="#272a2f"/></g>
<rect id="decoration-inactive-center" x="8" y="91" width="24" height="24" class="ColorScheme-Background" fill="#272a2f"/>
<g id="decoration-inactive-right"><rect x="32" y="91" width="7" height="24" class="ColorScheme-Background" fill="#272a2f"/><rect x="39" y="91" width="1" height="24" fill="#363b42"/></g>
<rect id="decoration-inactive-bottomleft" x="0" y="115" width="8" height="1" fill="#363b42"/>
<rect id="decoration-inactive-bottom" x="8" y="115" width="24" height="1" fill="#363b42"/>
<rect id="decoration-inactive-bottomright" x="32" y="115" width="8" height="1" fill="#363b42"/>
</svg>
