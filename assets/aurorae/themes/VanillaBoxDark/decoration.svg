<svg xmlns="http://www.w3.org/2000/svg" width="40" height="116">
<!-- Corner tiles are 8 wide so the top two corners can carry an 8px radius.
     Each corner draws the border colour first and lays the background over it
     inset by 1px, which is what leaves a 1px outline along the rounded edge.
     The bottom corners stay square: the decoration is the titlebar only, and
     the window's contents continue straight below it. -->
<g id="decoration-topleft"><path d="M0,31 L0,8 C0,3.582 3.582,0 8,0 L8,31 Z" fill="#383838"/><path d="M1,31 L1,8 C1,4.135 4.135,1 8,1 L8,31 Z" class="ColorScheme-Background" fill="#292929"/></g>
<g id="decoration-top"><rect x="8" y="0" width="24" height="1" fill="#383838"/><rect x="8" y="1" width="24" height="30" class="ColorScheme-Background" fill="#292929"/></g>
<g id="decoration-topright"><path d="M40,31 L40,8 C40,3.582 36.418,0 32,0 L32,31 Z" fill="#383838"/><path d="M39,31 L39,8 C39,4.135 35.865,1 32,1 L32,31 Z" class="ColorScheme-Background" fill="#292929"/></g>
<g id="decoration-left"><rect x="0" y="31" width="1" height="24" fill="#383838"/><rect x="1" y="31" width="7" height="24" class="ColorScheme-Background" fill="#292929"/></g>
<rect id="decoration-center" x="8" y="31" width="24" height="24" class="ColorScheme-Background" fill="#292929"/>
<g id="decoration-right"><rect x="32" y="31" width="7" height="24" class="ColorScheme-Background" fill="#292929"/><rect x="39" y="31" width="1" height="24" fill="#383838"/></g>
<rect id="decoration-bottomleft" x="0" y="55" width="8" height="1" fill="#383838"/>
<rect id="decoration-bottom" x="8" y="55" width="24" height="1" fill="#383838"/>
<rect id="decoration-bottomright" x="32" y="55" width="8" height="1" fill="#383838"/>
<g id="decoration-inactive-topleft"><path d="M0,91 L0,68 C0,63.582 3.582,60 8,60 L8,91 Z" fill="#383838"/><path d="M1,91 L1,68 C1,64.135 4.135,61 8,61 L8,91 Z" class="ColorScheme-Background" fill="#292929"/></g>
<g id="decoration-inactive-top"><rect x="8" y="60" width="24" height="1" fill="#383838"/><rect x="8" y="61" width="24" height="30" class="ColorScheme-Background" fill="#292929"/></g>
<g id="decoration-inactive-topright"><path d="M40,91 L40,68 C40,63.582 36.418,60 32,60 L32,91 Z" fill="#383838"/><path d="M39,91 L39,68 C39,64.135 35.865,61 32,61 L32,91 Z" class="ColorScheme-Background" fill="#292929"/></g>
<g id="decoration-inactive-left"><rect x="0" y="91" width="1" height="24" fill="#383838"/><rect x="1" y="91" width="7" height="24" class="ColorScheme-Background" fill="#292929"/></g>
<rect id="decoration-inactive-center" x="8" y="91" width="24" height="24" class="ColorScheme-Background" fill="#292929"/>
<g id="decoration-inactive-right"><rect x="32" y="91" width="7" height="24" class="ColorScheme-Background" fill="#292929"/><rect x="39" y="91" width="1" height="24" fill="#383838"/></g>
<rect id="decoration-inactive-bottomleft" x="0" y="115" width="8" height="1" fill="#383838"/>
<rect id="decoration-inactive-bottom" x="8" y="115" width="24" height="1" fill="#383838"/>
<rect id="decoration-inactive-bottomright" x="32" y="115" width="8" height="1" fill="#383838"/>
</svg>
